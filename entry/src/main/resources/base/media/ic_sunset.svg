<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Sun dome (semicircle band, r=6 outer / r=4 inner with round caps) -->
    <path d="M 6 18 A 6 6 0 0 1 18 18 A 1 1 0 0 1 16 18 A 4 4 0 0 0 8 18 A 1 1 0 0 1 6 18 Z"
          fill="currentColor"/>
    <!-- Arrow shaft -->
    <rect x="11" y="2" width="2" height="8" rx="1" fill="currentColor"/>
    <!-- Arrowhead (chevron band, notched apex) -->
    <path d="M 12 2 L 15.5 6.5 L 14 7 L 12 4.5 L 10 7 L 8.5 6.5 Z"
          fill="currentColor"/>
    <!-- Ground line -->
    <rect x="3" y="21" width="18" height="2" rx="1" fill="currentColor"/>
    <!-- Left ray -->
    <rect x="1" y="12" width="5" height="2" rx="1" fill="currentColor"/>
    <!-- Right ray -->
    <rect x="18" y="12" width="5" height="2" rx="1" fill="currentColor"/>
</svg>