        <circle cx="256" cy="50" r="13"/>
        <circle cx="256" cy="86" r="13"/>
        <circle cx="256" cy="122" r="13"/>
        <circle cx="256" cy="152" r="6"/>
        <circle cx="256" cy="170" r="4"/>

        <!-- Top finial -->
