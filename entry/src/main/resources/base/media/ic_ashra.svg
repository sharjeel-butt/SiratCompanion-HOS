      M148 418 L148 355 Q163 285 178 275 Q193 285 208 355 L208 418 Z
      M226 418 L226 348 Q241 275 256 265 Q271 275 286 348 L286 418 Z
      M304 418 L304 355 Q319 285 334 275 Q349 285 364 355 L364 418 Z"/>

